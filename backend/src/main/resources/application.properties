spring.application.name=FuelFitBackend
server.address=127.0.0.1
server.port=8080

# Use the database-free development profile unless another profile is selected.
spring.profiles.default=dev
app.frontend-origin=${FRONTEND_ORIGIN:http://127.0.0.1:8859}

# Never execute schema/data scripts or generate tables automatically.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when deployed behind HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.jackson.deserialization.accept-float-as-int=false
